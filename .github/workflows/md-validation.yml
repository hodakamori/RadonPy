name: MD validation
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.lock
      - run: pip install -r tests/requirements.lock
      - run: python -m pytest -m 'not engines' --junitxml=unit-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: unit-results.xml
  engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/engines.Dockerfile
          tags: radonpy-md-validation:local
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Require both engines; retain failed inputs and logs
        run: >-
          docker run --rm -v "$PWD:/work" radonpy-md-validation:local
          python -m pytest --require-engines -m engines
          --basetemp=/work/validation-results/pytest
          --junitxml=/work/validation-results/engines.xml
      - name: Reproducible A/B/C report
        run: >-
          docker run --rm -v "$PWD:/work" radonpy-md-validation:local
          python -m radonpy.sim.validation static tests/fixtures/pmma_gaff2.json
          --output validation-results/static
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: md-validation
          path: validation-results/
          retention-days: 14
